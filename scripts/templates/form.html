<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Inventory - Add Card</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px 0;
        }
        .container {
            max-width: 600px;
        }
        .card {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: none;
        }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
        }
        .form-label {
            font-weight: 500;
            color: #333;
        }
        .form-control:focus,
        .form-select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }
        .alert {
            border: none;
            border-left: 4px solid;
        }
        .alert-success {
            border-left-color: #28a745;
            background-color: #f1f9f6;
        }
        .alert-danger {
            border-left-color: #dc3545;
            background-color: #fdf4f5;
        }
        .alert-warning {
            border-left-color: #ffc107;
            background-color: #fffdf4;
        }
        .required::after {
            content: " *";
            color: red;
        }
        .spinner-border {
            width: 1rem;
            height: 1rem;
            margin-right: 0.5rem;
        }
        .form-section {
            margin-bottom: 1.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #e9ecef;
        }
        .form-section:last-of-type {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .section-title {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 1rem;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-header">
                <h2 class="mb-0">➕ Add New Card</h2>
                <small>Enter card details to add to your inventory</small>
            </div>
            <div class="card-body p-4">
                <div id="alertContainer"></div>

                <form id="cardForm" onsubmit="handleSubmit(event)">
                    <!-- Core Identification -->
                    <div class="form-section">
                        <h6 class="section-title">Identification</h6>

                        <div class="mb-3">
                            <label for="sport" class="form-label required">Sport</label>
                            <select class="form-select" id="sport" name="sport" required>
                                <option value="">-- Select Sport --</option>
                                {% for sport in valid_sports %}
                                <option value="{{ sport }}">{{ sport.title() }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="year" class="form-label required">Year</label>
                                    <input type="number" class="form-control" id="year" name="year" 
                                           min="1900" max="2100" required 
                                           placeholder="e.g. 2023">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="manufacturer" class="form-label required">Manufacturer</label>
                                    <input type="text" class="form-control" id="manufacturer" name="manufacturer" 
                                           required placeholder="e.g. Topps, Panini">
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="setName" class="form-label required">Set Name</label>
                            <input type="text" class="form-control" id="setName" name="set_name" 
                                   required placeholder="e.g. Chrome Rookie, Prizm">
                        </div>

                        <div class="row">
                            <div class="col-md-8">
                                <div class="mb-3">
                                    <label for="playerName" class="form-label required">Player Name</label>
                                    <input type="text" class="form-control" id="playerName" name="player_name" 
                                           required placeholder="e.g. LeBron James">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="cardNumber" class="form-label">Card #</label>
                                    <input type="text" class="form-control" id="cardNumber" name="card_number" 
                                           placeholder="e.g. 221">
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="team" class="form-label">Team</label>
                            <input type="text" class="form-control" id="team" name="team" 
                                   placeholder="e.g. Cleveland Cavaliers">
                        </div>
                    </div>

                    <!-- Variants & Attributes -->
                    <div class="form-section">
                        <h6 class="section-title">Variants & Attributes</h6>

                        <div class="mb-3">
                            <label for="parallelName" class="form-label">Parallel Name</label>
                            <input type="text" class="form-control" id="parallelName" name="parallel_name" 
                                   placeholder="e.g. Gold Refractor, Silver Prizm">
                        </div>

                        <div class="mb-3">
                            <label for="insertName" class="form-label">Insert Name</label>
                            <input type="text" class="form-control" id="insertName" name="insert_name" 
                                   placeholder="e.g. Future Stars, Legendary">
                        </div>

                        <div class="row">
                            <div class="col-6">
                                <div class="form-check mb-3">
                                    <input class="form-check-input" type="checkbox" id="isAuto" name="is_auto">
                                    <label class="form-check-label" for="isAuto">
                                        Autograph
                                    </label>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="form-check mb-3">
                                    <input class="form-check-input" type="checkbox" id="isRelic" name="is_relic">
                                    <label class="form-check-label" for="isRelic">
                                        Memorabilia
                                    </label>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="form-check mb-3">
                                    <input class="form-check-input" type="checkbox" id="isPatch" name="is_patch">
                                    <label class="form-check-label" for="isPatch">
                                        Patch Relic
                                    </label>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="form-check mb-3">
                                    <input class="form-check-input" type="checkbox" id="isRookie" name="is_rookie">
                                    <label class="form-check-label" for="isRookie">
                                        Rookie Card
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="printRun" class="form-label">Print Run</label>
                                    <input type="number" class="form-control" id="printRun" name="print_run" 
                                           min="1" placeholder="e.g. 25 for /25">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Notes -->
                    <div class="form-section">
                        <div class="mb-3">
                            <label for="notes" class="form-label">Notes</label>
                            <textarea class="form-control" id="notes" name="notes" rows="3" 
                                      placeholder="Any additional notes about this card..."></textarea>
                        </div>
                    </div>

                    <!-- Submit -->
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg" id="submitBtn">
                            <span id="submitText">➕ Add Card</span>
                            <span id="submitSpinner" class="spinner-border d-none"></span>
                        </button>
                    </div>
                </form>

                <hr class="my-4">
                <small class="text-muted">
                    Fields marked with <span class="required"></span> are required.<br>
                    Cards are checked for duplicates before insertion.
                </small>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function showAlert(type, message) {
            const alertContainer = document.getElementById('alertContainer');
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type} alert-dismissible fade show`;
            alertDiv.setAttribute('role', 'alert');
            alertDiv.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            alertContainer.innerHTML = '';
            alertContainer.appendChild(alertDiv);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function setSubmitting(isSubmitting) {
            const submitBtn = document.getElementById('submitBtn');
            const submitText = document.getElementById('submitText');
            const submitSpinner = document.getElementById('submitSpinner');

            submitBtn.disabled = isSubmitting;
            if (isSubmitting) {
                submitText.classList.add('d-none');
                submitSpinner.classList.remove('d-none');
            } else {
                submitText.classList.remove('d-none');
                submitSpinner.classList.add('d-none');
            }
        }

        async function handleSubmit(event) {
            event.preventDefault();
            
            setSubmitting(true);
            
            // Collect form data
            const formData = new FormData(document.getElementById('cardForm'));
            const data = {
                sport: formData.get('sport'),
                year: parseInt(formData.get('year')),
                manufacturer: formData.get('manufacturer'),
                set_name: formData.get('set_name'),
                card_number: formData.get('card_number') || null,
                player_name: formData.get('player_name'),
                team: formData.get('team') || null,
                parallel_name: formData.get('parallel_name') || null,
                insert_name: formData.get('insert_name') || null,
                is_auto: document.getElementById('isAuto').checked,
                is_relic: document.getElementById('isRelic').checked,
                is_patch: document.getElementById('isPatch').checked,
                is_rookie: document.getElementById('isRookie').checked,
                is_numbered: false,
                print_run: formData.get('print_run') ? parseInt(formData.get('print_run')) : null,
                notes: formData.get('notes') || null
            };

            try {
                const response = await fetch('/api/add-card', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    showAlert('success', 
                        `✅ <strong>Success!</strong> Card added (ID: ${result.card_id})<br>` +
                        `${result.card_data.player_name} - ${result.card_data.sport.toUpperCase()} ${result.card_data.year}`
                    );
                    document.getElementById('cardForm').reset();
                } else if (response.status === 409) {
                    showAlert('warning',
                        `⚠️ <strong>Duplicate Card</strong><br>` +
                        `This card already exists in your inventory (ID: ${result.existing_card_id}).<br>` +
                        `Did you mean to add inventory to this card instead?`
                    );
                } else {
                    showAlert('danger', `❌ <strong>Error:</strong> ${result.error}`);
                }
            } catch (error) {
                showAlert('danger', `❌ <strong>Error:</strong> ${error.message}`);
            } finally {
                setSubmitting(false);
            }
        }

        // Auto-scroll to alerts
        document.getElementById('alertContainer').addEventListener('shown.bs.alert', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    </script>
</body>
</html>
