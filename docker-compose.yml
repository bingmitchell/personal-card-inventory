# Docker deployment option (optional — the app also runs standalone without Docker).
# The SQLite database file is persisted in ./data/ on the host.
#
#   docker compose up --build
#   open http://localhost:8000/form

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      CARD_DB_PATH: /data/card_inventory.db
    volumes:
      - ./data:/data
    restart: unless-stopped
