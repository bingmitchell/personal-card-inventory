<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Card Inventory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh;
               display: flex; align-items: center; justify-content: center; }
        .spinner-border { width: 3rem; height: 3rem; color: white; }
    </style>
</head>
<body>
    <div class="text-center text-white">
        <div class="spinner-border mb-3" role="status"></div>
        <div>Loading Card Inventory…</div>
    </div>
    <script type="module">
        import { initDB } from './js/db.js';
        try {
            await initDB();
            window.location.href = 'inventory.html';
        } catch (e) {
            document.body.innerHTML = `<div class="text-white text-center p-4">
                <h4>Failed to initialize database</h4><pre>${e.message}</pre>
            </div>`;
        }
    </script>
</body>
</html>
